packages:
  - website

overrides:
  "react-reconciler": "^0.33.0"
  # Rspress docs: hast-util-to-estree@3.1.3 bare-imports style-to-js; 1.x is CJS-only
  # and its default import breaks under native ESM (Node 24+), breaking all code blocks.
  "style-to-js": "2.0.2"
allowBuilds:
  '@l1xnan/tree-sitter-sql': false
  tree-sitter: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@hookform/resolvers@5.4.0'
  - idb-keyval@6.2.4
  - '@l1xnan/tree-sitter-sql@0.4.7'
